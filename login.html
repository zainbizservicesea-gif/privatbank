<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoBank — Registration Demo</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #202124; background: #fafafa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fafafa; }
    body { min-height: 100vh; display: flex; justify-content: center; }
    .phone-screen { position: relative; width: min(100vw, 788px); min-height: 100vh; overflow: hidden; background: #fafafa; }
    header { height: 113px; display: flex; align-items: center; border-bottom: 1px solid #e4e4e4; padding: 14px 40px 8px; }
    .back { width: 48px; height: 48px; display: grid; place-items: center; margin-right: 26px; color: #202124; font-size: 52px; font-weight: 200; line-height: 40px; transform: translateY(-2px); }
    .heading h1 { margin: 0 0 3px; font-size: clamp(27px, 4.1vw, 43px); font-weight: 400; letter-spacing: -1px; }
    .heading p { margin: 0; color: #858585; font-size: clamp(20px, 3vw, 31px); }
    main { display: flex; flex-direction: column; align-items: center; padding-top: 117px; text-align: center; }
    .call-animation { position: relative; width: 272px; height: 272px; display: grid; place-items: center; }
    .ring, .ring-soft { position: absolute; border-radius: 50%; pointer-events: none; }
    .ring { inset: 0; border: 12px solid transparent; border-top-color: #b5e08d; border-right-color: #83cc3e; border-bottom-color: #83cc3e; animation: spin 2.2s linear infinite; }
    .ring-soft { inset: 11px; border: 5px solid transparent; border-left-color: #e3f1d7; border-bottom-color: #e3f1d7; animation: spin-reverse 2.8s linear infinite; }
    .phone-svg { width: 92px; height: 92px; fill: #84ca3c; animation: ring-pulse 1.3s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes ring-pulse { 0%,100% { transform: rotate(-42deg) scale(1); } 50% { transform: rotate(-42deg) scale(1.07); } }
    .copy { margin-top: 132px; }
    .copy p { margin-left: 20px; margin-right: 20px; }
    .caller { margin-top: 0; margin-bottom: 0; font-size: clamp(27px, 4vw, 39px); font-weight: 400; }
    .number { margin-top: 25px; margin-bottom: 0; font-size: clamp(31px, 5vw, 51px); font-weight: 300; letter-spacing: .2px; }
    .instruction { margin-top: 29px; margin-bottom: 0; font-size: clamp(22px, 3.4vw, 34px); }
    .countdown { margin-top: 62px; color: #c7c7c7; font-size: clamp(23px, 3.3vw, 33px); line-height: 1.24; }
    @media (max-width: 520px) {
      header { height: 82px; padding: 10px 19px; }
      .back { width: 35px; height: 35px; margin-right: 13px; font-size: 39px; }
      main { padding-top: 75px; }
      .call-animation { width: 190px; height: 190px; }
      .ring { border-width: 9px; }
      .ring-soft { inset: 8px; border-width: 4px; }
      .phone-svg { width: 68px; height: 68px; }
      .copy { margin-top: 92px; }
      .number { margin-top: 17px; }
      .instruction { margin-top: 18px; }
      .countdown { margin-top: 42px; }
    }
  </style>
</head>
<body>
  <div class="phone-screen">
    <header>
      <div class="back" aria-hidden="true">‹</div>
      <div class="heading"><h1>A call from DemoBank</h1><p>Registration</p></div>
    </header>
    <main>
      <div class="call-animation" aria-label="Decorative animated incoming call icon">
        <div class="ring"></div>
        <div class="ring-soft"></div>
        <svg class="phone-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
      </div>
      <section class="copy" aria-label="Demo call information">
        <p class="caller">DemoBank is calling</p>
        <p class="number">+38 056 797 6010</p>
        <p class="instruction">Answer the call and follow the instruction</p>
        <p class="countdown">Confirmation using SMS will be<br />available in <span id="timer">01:00</span></p>
      </section>
    </main>
  </div>
  <script>
    let remaining = 60;
    const timer = document.getElementById('timer');
    const renderTimer = () => {
      const minutes = String(Math.floor(remaining / 60)).padStart(2, '0');
      const seconds = String(remaining % 60).padStart(2, '0');
      timer.textContent = ${minutes}:${seconds};
      if (remaining > 0) remaining -= 1;
    };
    renderTimer();
    setInterval(renderTimer, 1000);
  </script>
</body>
</html>
